*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"Plus Jakarta Sans",Arial,sans-serif;overflow:hidden;cursor:none}
.wrap{height:100vh;display:-webkit-box;display:flex;-webkit-box-orient:vertical;flex-direction:column}
.franja{height:1vh;display:none;flex-shrink:0;background:linear-gradient(#74ACDF 0,#74ACDF 33.3%,#fff 33.3%,#fff 66.6%,#74ACDF 66.6%)}
body.t-albiceleste .franja{display:block}
.top{height:11.9vh;padding:0 3.3vw;display:flex;align-items:center;justify-content:space-between;background:var(--top);color:var(--topTxt);border-bottom:1px solid var(--topB);flex-shrink:0}
.marca{display:flex;align-items:center}
.marca img{width:6.7vh;height:6.7vh;border-radius:50%;display:block;box-shadow:0 0 0 .4vh rgba(255,255,255,.12);margin-right:1.7vh;object-fit:cover}
.org{font-family:"Montserrat",Arial,sans-serif;font-weight:700;font-size:5.2vh;letter-spacing:-.01em;line-height:1}
.div{width:2px;height:5.9vh;background:var(--div);margin:0 2.2vh}
.ofi{font-size:4.8vh;font-weight:800;letter-spacing:-.015em;line-height:1.05;white-space:nowrap}
.ofi .secc{color:var(--topSecc,var(--pre));margin-left:.25em}
.sub{font-size:2vh;color:var(--topSub);font-weight:500;margin-top:.2vh}
.reloj{text-align:right}
.reloj b{font-family:"Space Grotesk",Arial,sans-serif;font-size:5.6vh;font-weight:600;line-height:1;display:block}
.reloj span{font-size:2vh;color:var(--topSub);display:block;margin-top:.6vh}
.cuerpo{-webkit-box-flex:1;flex:1;display:flex;padding:3.7vh 3.3vw;min-height:0}
.actual{position:relative;-webkit-box-flex:1.35;flex:1.35 1 0;min-width:0;margin-right:2.1vw;background:var(--card);border:1px solid var(--cardB);border-radius:3.3vh;display:flex;flex-direction:column;overflow:hidden}
#actualIn{position:relative;display:flex;flex-direction:column;-webkit-box-flex:1;flex:1;min-height:0;width:100%}
.arriba{-webkit-box-flex:1;flex:1;min-height:0;display:flex;flex-direction:column;padding:4.5vh 3.6vw 3vh;overflow:hidden}
/* centrado con márgenes automáticos: si algo no entra, sobra para abajo y se nota al medir */
.arriba>*{flex-shrink:0}
.arriba>.etq{margin-top:auto}
.arriba>:last-child{margin-bottom:auto}
.solfondo{position:absolute;right:-16vh;top:-10vh;width:54vh;height:54vh;display:none;pointer-events:none}
body.t-celeste .solfondo{display:block;opacity:.16}
body.t-sol .solfondo{display:block;opacity:.24}
.actual.flash{-webkit-animation:fl .9s ease-in-out 4;animation:fl .9s ease-in-out 4}
@-webkit-keyframes fl{0%,100%{background:var(--card)}50%{background:var(--flash)}}
@keyframes fl{0%,100%{background:var(--card)}50%{background:var(--flash)}}
.etq{display:flex;align-items:center;font-size:3vh;font-weight:700;color:var(--mut)}
/* Punto verde fijo con una onda que sale siempre de adentro hacia afuera y se desvanece
   (nunca vuelve hacia el centro) */
.pulso{position:relative;width:1.7vh;height:1.7vh;border-radius:50%;background:#45D483;margin:0 2.2vh 0 .9vh;flex-shrink:0}
.pulso:after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:#45D483;-webkit-animation:onda 1.6s ease-out infinite;animation:onda 1.6s ease-out infinite}
@-webkit-keyframes onda{0%{opacity:.7;-webkit-transform:scale(1)}100%{opacity:0;-webkit-transform:scale(3)}}
@keyframes onda{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
/* El nombre en letra angosta: entra más grande en una línea y se lee de lejos */
.nom .l{display:block;white-space:nowrap}
.nom{margin-top:2.2vh;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:13vh;font-weight:800;line-height:.98;text-transform:uppercase;max-width:100%;word-wrap:break-word}
/* El dominio va en una patente, el objeto que todos en la sala conocen */
/* La franja azul llega de borde a borde: sin marco, el contorno lo da una sombra fina */
.placa{margin-top:4.2vh;display:inline-block;align-self:flex-start;background:#FBFBF8;border-radius:1.4vh;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 1.2vh 3vh rgba(0,0,0,.28)}
/* Franja como la chapa Mercosur: "DOMINIO" chiquito a la izquierda, REPÚBLICA ARGENTINA al centro, bandera a la derecha */
.placa .pb{display:flex;align-items:center;background:#1D4FA3;color:#fff;padding:.7vh 1.6vh}
.placa .pb .ld,.placa .pb .bw{width:8vh;flex-shrink:0}
.placa .pb .ld{font-size:1.3vh;font-weight:700;letter-spacing:.12em;opacity:.8}
.placa .pb .ra{-webkit-box-flex:1;flex:1;text-align:center;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:2.7vh;font-weight:700;letter-spacing:.06em;line-height:1;white-space:nowrap;padding:0 1.4vh}
.placa .pb .bw{display:flex;justify-content:flex-end}
.placa .bandera{display:block;width:3.6vh;height:2.4vh;border-radius:.3vh;background:linear-gradient(#74ACDF 0,#74ACDF 33.3%,#fff 33.3%,#fff 66.6%,#74ACDF 66.6%)}
.placa .pn{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:11.5vh;font-weight:700;line-height:1;color:#12161E;letter-spacing:.06em;padding:.6vh 3.6vh 1vh;white-space:nowrap;text-align:center}
/* Adónde ir: una franja de punta a punta, del color de cada lugar */
.destino{display:flex;align-items:center;padding:3vh 3.6vw;color:var(--chipTxt);flex-shrink:0}
.destino.mesa{background:var(--chipM)}.destino.caja{background:var(--chipC)}
.destino svg{width:6vh;height:6vh;flex-shrink:0;margin-right:2.4vh}
.destino .dl{font-size:3.4vh;font-weight:600;margin-right:1.6vh;opacity:.8}
.destino b{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:7.4vh;font-weight:800;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nuevo .nom,.nuevo .placa,.nuevo .destino b{-webkit-animation:entra .7s cubic-bezier(.2,.8,.2,1) both;animation:entra .7s cubic-bezier(.2,.8,.2,1) both}
.nuevo .placa{-webkit-animation-delay:.12s;animation-delay:.12s}
.nuevo .destino b{-webkit-animation-delay:.24s;animation-delay:.24s}
@-webkit-keyframes entra{from{opacity:0;-webkit-transform:translateY(3vh)}to{opacity:1;-webkit-transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}
.espera{margin:auto;padding:6vh 4vw;text-align:center}
.espera b{display:block;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:10vh;font-weight:700;line-height:1;text-transform:uppercase}
.espera span{display:block;margin-top:2.4vh;font-size:3vh;color:var(--mut);font-weight:500}
.col{-webkit-box-flex:1;flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0}
.panel{background:var(--panel);border:1px solid var(--panelB);border-radius:3vh;padding:2.6vh 2.1vw 1.6vh;overflow:hidden}
.panel h3{font-size:2.6vh;font-weight:700;color:var(--mut);margin-bottom:1vh}
.item{display:flex;align-items:center;padding:.95vh 0;border-top:1px solid var(--itemB)}
.item .txt{-webkit-box-flex:1;flex:1;min-width:0;margin-right:1.2vw}
.item .n{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:3.9vh;font-weight:700;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .p{font-family:"Space Grotesk",Arial,sans-serif;font-size:2.1vh;font-weight:600;color:var(--itemP);margin-top:.3vh;letter-spacing:.03em}
.item .der{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.tag{font-size:1.85vh;font-weight:700;padding:.55vh 1.5vh;border-radius:99vh;letter-spacing:.04em;white-space:nowrap}
.tag.mesa{background:var(--tagMb);color:var(--tagMf)}.tag.caja{background:var(--tagCb);color:var(--tagCf)}.tag.ausente{background:var(--tagAb);color:var(--tagAf);font-weight:800}
.hora{font-size:1.85vh;color:var(--hora);margin-top:.7vh}
.aus{margin-top:2vh;background:var(--ausB);border-color:var(--ausBd)}
.aus h3{color:var(--ausT)}
.aus .item{border-top-color:var(--ausI)}
.aus .hora{color:var(--ausH)}
.vacio{color:var(--vacio);font-size:2.2vh;padding:1vh 0}
.pie{height:7vh;display:flex;align-items:center;justify-content:center;font-size:2.2vh;color:var(--pieTxt);background:var(--pie);border-top:1px solid var(--topB);flex-shrink:0}
.pie i{display:inline-block;width:.6vh;height:.6vh;border-radius:50%;background:var(--pieDot);margin:0 2.6vh}
#sonido{position:fixed;left:2vh;bottom:9vh;background:#FFC857;color:#0A1120;font-weight:700;font-size:2vh;padding:1.2vh 2vh;border-radius:1.2vh;display:none;cursor:pointer}
#offline{position:fixed;right:2vh;bottom:9vh;background:#45211F;color:#FFB4AB;font-size:1.9vh;padding:1vh 1.6vh;border-radius:1vh;display:none}
</style>
</head>

<script>
(function () {
  var T = window.TT, ultimoSeq = null, ultimaPrueba = null, sonido = 'dingdong', logoVer = '';
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function $(id) { return document.getElementById(id); }
  function reloj() {
    var d = new Date();
    $('hora').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    var f = DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    $('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  }
  reloj(); setInterval(reloj, 5000);

  // el nombre arranca bien grande y se achica hasta entrar en dos renglones como mucho
  function ajustar(el) {
    if (!el) return;
    var caja = el.parentNode, fs = 14, vh = window.innerHeight / 100;
    el.style.fontSize = fs + 'vh';
    // que entre a lo ancho y que la patente no quede cortada abajo
    while (fs > 5 && (el.scrollWidth > el.clientWidth + 2 || caja.scrollHeight > caja.clientHeight + 2)) {
      fs -= 0.4; el.style.fontSize = fs + 'vh';
    }
  }
  // cuando terminan de cargar las letras se vuelve a medir (antes mide con otra letra)
  // (se pide la letra del nombre explícitamente: si no, a veces se mide con otra más ancha y queda chico)
  if (document.fonts && document.fonts.load) {
    var refit = function () { ajustar($('nomActual')); };
    document.fonts.load('800 50px "Barlow Condensed"').then(refit, refit);
    document.fonts.load('700 50px "Barlow Condensed"').then(refit, refit);
  }
  // "PEREZ, MARIA LAURA": apellido en un renglón y nombres en el otro
  function nombreEnDos(n) {
    var i = n.indexOf(',');
    if (i < 0) return T.esc(n);
    return '<span class="l">' + T.esc(n.slice(0, i + 1)) + '</span><span class="l">' + T.esc(n.slice(i + 1).replace(/^\s+/, '')) + '</span>';
  }
  // "AB123CD" → "AB 123 CD" y "ABC123" → "ABC 123", como se ven en la chapa
  function patente(d) {
    d = String(d || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (d.length < 5) return '';
    var m = d.match(/^([A-Z]{2})(\d{3})([A-Z]{2})$/);
    if (m) return m[1] + ' ' + m[2] + ' ' + m[3];
    m = d.match(/^([A-Z]{3})(\d{3})$/);
    if (m) return m[1] + ' ' + m[2];
    return d;
  }
  var FLECHA = '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="currentColor" opacity=".16"/><path d="M14 24h19M25 15l9 9-9 9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var mostrado = '';

  function render(v) {
    var e = v.estado, c = v.config, porId = {}, i;
    if (sonido !== (c.sonido || 'dingdong') || !render.pre) { sonido = c.sonido || 'dingdong'; T.precargar(sonido); render.pre = true; }
    $('org').textContent = c.organismo || '';
    $('org').style.display = $('orgDiv').style.display = c.organismo ? '' : 'none';
    $('ofi').textContent = c.oficina || 'Registro Automotor';
    $('secc').textContent = c.seccional || '';
    var lv = c.tieneLogo ? 'si' : 'no';
    if (lv !== logoVer) { logoVer = lv; $('logo').src = '/logo.png?v=' + new Date().getTime(); }
    for (i = 0; i < (e.turnos || []).length; i++) porId[e.turnos[i].id] = e.turnos[i];
    var ll = e.llamados || [], ultimo = ll.length ? ll[ll.length - 1] : null;
    var box = $('actual'), inner = $('actualIn');
    var tema = c.temaTV || 'noche';
    if (document.body.className !== 't-' + tema) document.body.className = 't-' + tema;
    if (ultimo && porId[ultimo.turnoId]) {
      var t = porId[ultimo.turnoId];
      var html = '<div class="arriba"><div class="etq"><span class="pulso"></span>Llamando ahora</div>' +
        '<div class="nom" id="nomActual">' + nombreEnDos(T.nombre(t.nombre)) + '</div>' +
        (patente(t.dominio) ? '<div class="placa"><div class="pb"><span class="ld">DOMINIO</span><span class="ra">REPÚBLICA ARGENTINA</span><span class="bw"><i class="bandera"></i></span></div><div class="pn">' + T.esc(patente(t.dominio)) + '</div></div>' : '') +
        '</div><div class="destino ' + (ultimo.dest === 'caja' ? 'caja' : 'mesa') + '">' + FLECHA + '<span class="dl">Diríjase a</span><b>' + T.esc(ultimo.destino) + '</b></div>';
      // solo se vuelve a dibujar si cambió algo (así la entrada no se repite sola)
      if (html !== mostrado) {
        var esNuevo = mostrado !== '' && ultimoSeq !== null && ultimo.seq > ultimoSeq;
        inner.innerHTML = html; mostrado = html;
        inner.className = esNuevo ? 'nuevo' : '';
        ajustar($('nomActual'));
      }
    } else if (mostrado !== 'espera') {
      mostrado = 'espera';
      inner.className = '';
      inner.innerHTML = '<div class="espera"><b>Aguarde a ser llamado</b><span>Su nombre va a aparecer en esta pantalla</span></div>';
    }
    // últimos llamados: distintas personas, sin la actual
    var vistos = {}, ult = [], max = c.ultimos || 5;
    if (ultimo) vistos[ultimo.turnoId] = true;
    for (i = ll.length - 1; i >= 0 && ult.length < max; i--) {
      if (vistos[ll[i].turnoId] || !porId[ll[i].turnoId]) continue;
      vistos[ll[i].turnoId] = true; ult.push(ll[i]);
    }
    var h = '';
    for (i = 0; i < ult.length; i++) {
      var tu = porId[ult[i].turnoId], aus = tu.estado === 'ausente';
      h += '<div class="item"><div class="txt"><div class="n">' + T.esc(T.nombre(tu.nombre)) + '</div><div class="p">' + T.esc(tu.precarga) + '</div></div>' +
        '<div class="der"><span class="tag ' + (aus ? 'ausente' : ult[i].dest) + '">' + (aus ? 'AUSENTE' : T.esc(ult[i].etiqueta)) + '</span><span class="hora">' + T.hhmm(ult[i].hora) + '</span></div></div>';
    }
    $('ultimos').innerHTML = h || '<div class="vacio">Todavía no se llamó a nadie.</div>';
    // ausentes
    var ausentes = [], maxA = c.ausentes == null ? 3 : c.ausentes;
    for (i = 0; i < (e.turnos || []).length; i++) if (e.turnos[i].estado === 'ausente') ausentes.push(e.turnos[i]);
    ausentes.sort(function (a, b) { return new Date(b.ausenteA) - new Date(a.ausenteA); });
    ausentes = ausentes.slice(0, maxA);
    $('pAus').style.display = maxA > 0 ? '' : 'none';
    h = '';
    for (i = 0; i < ausentes.length; i++) {
      var a = ausentes[i];
      h += '<div class="item"><div class="txt"><div class="n">' + T.esc(T.nombre(a.nombre)) + '</div>' + (a.precarga ? '<div class="p">' + T.esc(a.precarga) + '</div>' : '') + '</div>' +
        '<div class="der"><span class="tag ' + (a.ausenteEn === 'caja' ? 'caja' : 'mesa') + '">' + (a.ausenteEn === 'caja' ? 'CAJA' : 'MESA') + '</span><span class="hora">' + T.hhmm(a.ausenteA) + '</span></div></div>';
    }
    $('ausentes').innerHTML = h || '<div class="vacio">Nadie por ahora.</div>';

    // llamado nuevo: titilar y sonar
    if (ultimoSeq !== null && e.seq > ultimoSeq && ultimo && ultimo.seq > ultimoSeq) {
      box.className = 'actual'; void box.offsetWidth; box.className = 'actual flash';
      T.tocar(sonido, function (ok, det) { reportar(ok, det, false); });
      setTimeout(function () { if (!T.audioActivo()) $('sonido').style.display = 'block'; }, 1600);
    }
    // prueba de sonido pedida desde una PC
    if (ultimaPrueba !== null && v.pruebaSonido > ultimaPrueba) {
      T.tocar(sonido, function (ok, det) { reportar(ok, det, true); });
    }
    ultimaPrueba = v.pruebaSonido || 0;
    ultimoSeq = e.seq;
    if (v.version && window.__ver && v.version !== window.__ver) location.reload();
    window.__ver = v.version;
  }

  function reportar(ok, det, prueba) {
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/api/tv/reporte-sonido'); x.setRequestHeader('Content-Type', 'application/json');
      x.send(JSON.stringify({ ok: ok, prueba: prueba, detalle: sonido + ' · ' + det + ' · ' + navigator.userAgent.slice(0, 120) }));
    } catch (e) {}
  }

  document.addEventListener('click', function () { T.audio(); T.precargar(sonido); $('sonido').style.display = 'none'; });
  T.conectar('/api/eventos', render, function (ok, fallas) {
    $('offline').style.display = (!ok && fallas > 2) ? 'block' : 'none';
  });
  T.audio();
})();
</script>
</body>
</html>
